<header class="app-bar">
  <a class="product" routerLink="/repositories" aria-label="Skibidibi Git repositories">
    <img class="product-mark" src="/brand/skibidibi-git.svg" alt="" aria-hidden="true" />
    <strong>Skibidibi Git</strong>
  </a>
  <nav class="screen-tabs" aria-label="Application navigation">
    @if (workspaceUrl(); as workspace) {
      <a [routerLink]="workspace" routerLinkActive="active" ariaCurrentWhenActive="page">Workspace</a>
    }
    <a routerLink="/repositories" routerLinkActive="active" ariaCurrentWhenActive="page">Repositories</a>
    <a routerLink="/pull-requests" routerLinkActive="active" ariaCurrentWhenActive="page">Pull Requests</a>
    <a routerLink="/code-reviews" routerLinkActive="active" ariaCurrentWhenActive="page">Code Reviews</a>
    <a routerLink="/settings" routerLinkActive="active" ariaCurrentWhenActive="page">Settings</a>
  </nav>
  <div class="app-controls">
    <button
      type="button"
      class="update-trigger"
      [class.available]="applicationUpdate.state() === 'available'"
      [class.restart-ready]="applicationUpdate.state() === 'restartReady'"
      [disabled]="applicationUpdate.triggerDisabled()"
      [title]="applicationUpdate.triggerLabel()"
      (click)="applicationUpdate.trigger()"
    >
      <span class="update-trigger-icon" [class.spinning]="applicationUpdate.state() === 'checking' || applicationUpdate.state() === 'installing'" aria-hidden="true">↻</span>
      <span>{{ applicationUpdate.triggerLabel() }}</span>
    </button>
    <button
      type="button"
      class="commander-trigger"
      [class.active]="commander.open()"
      [disabled]="!commander.available()"
      [title]="commander.available() ? 'Open Skibi-Bot AI Commander' : 'Install or sign in to Codex, Claude or Cursor CLI'"
      (click)="commander.toggle()"
    >
      <app-skibi-bot aria-hidden="true" />
      <span>Ask Skibi-Bot</span>
    </button>
    <div class="font-scale" role="group" aria-label="Interface text size">
      <button type="button" [disabled]="!uiScale.canDecrease()" aria-label="Decrease text size" title="Decrease text size (Ctrl/Cmd −)" (click)="uiScale.decrease()">A−</button>
      <output [attr.aria-label]="'Text size ' + uiScale.percent() + ' percent'">{{ uiScale.percent() }}%</output>
      <button type="button" [disabled]="!uiScale.canIncrease()" aria-label="Increase text size" title="Increase text size (Ctrl/Cmd +)" (click)="uiScale.increase()">A+</button>
    </div>
    <a class="account-chip" routerLink="/settings" aria-label="Open GitHub account settings">
      <i [class.connected]="accountConnected()" aria-hidden="true"></i>
      <span>{{ accountLabel() }}</span>
    </a>
  </div>
</header>
<router-outlet />
<app-commander-panel />
<app-application-update-prompt />
<app-ui-feedback-host />
