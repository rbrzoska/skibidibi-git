@if (feedback.loading()) {
  <section class="skibi-loading-overlay" role="status" aria-live="polite" [attr.aria-label]="feedback.loadingLabel()">
    <div class="skibi-loader" aria-hidden="true">
      <svg viewBox="0 0 160 160">
        <defs>
          <linearGradient id="loader-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b93ff"/><stop offset="1" stop-color="#3f6fd6"/></linearGradient>
          <linearGradient id="loader-ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b93ff"/><stop offset="1" stop-color="#8fb4ff"/></linearGradient>
          <radialGradient id="loader-ant" cx=".5" cy=".3" r=".8"><stop offset="0" stop-color="#7fd98f"/><stop offset="1" stop-color="#4bb85f"/></radialGradient>
        </defs>
        <circle cx="80" cy="80" r="64" fill="none" stroke="rgba(91,147,255,.16)" stroke-width="7"/>
        <circle class="loader-arc" cx="80" cy="80" r="64" fill="none" stroke="url(#loader-ring)" stroke-width="7" stroke-linecap="round" stroke-dasharray="110 320"/>
        <rect x="48" y="46" width="64" height="60" rx="18" fill="url(#loader-bg)"/>
        <rect x="78" y="32" width="5" height="16" rx="2.5" fill="#bcd3ff"/>
        <circle class="loader-light" cx="80" cy="30" r="6.5" fill="url(#loader-ant)"/>
        <g class="loader-eyes">
          <circle cx="70" cy="72" r="9" fill="#fff"/><circle cx="92" cy="72" r="9" fill="#fff"/>
          <g class="loader-pupil left"><circle cx="70" cy="69.2" r="4" fill="#3f6fd6"/><circle cx="68.6" cy="67.8" r="1.4" fill="#fff"/></g>
          <g class="loader-pupil right"><circle cx="92" cy="69.2" r="4" fill="#3f6fd6"/><circle cx="90.6" cy="67.8" r="1.4" fill="#fff"/></g>
        </g>
        <path d="M67 90 Q80 98 93 90" stroke="#e3b341" stroke-width="3.2" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <strong>{{ feedback.loadingLabel() }}</strong>
  </section>
}

@if (feedback.toasts().length > 0) {
  <section class="skibi-toast-container" aria-label="Application notifications">
    @for (toast of feedback.toasts(); track toast.id) {
      <article class="skibi-toast" [attr.data-kind]="toast.kind" [attr.role]="toast.kind === 'error' ? 'alert' : 'status'">
        <div class="speech-bubble">
          <strong>{{ toast.title }}</strong>
          <p>{{ toast.message }}</p>
          <button type="button" (click)="feedback.dismiss(toast.id)" [attr.aria-label]="'Dismiss ' + toast.title" title="Dismiss">×</button>
        </div>
        <app-skibi-bot class="toast-bot" [mood]="mood(toast.kind)" />
      </article>
    }
  </section>
}
