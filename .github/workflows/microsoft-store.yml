name: Build Microsoft Store MSIX

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable tag or commit SHA to package (use main only for a test build)
        required: true
        default: main
        type: string
      identity_name:
        description: Package/Identity/Name copied from Partner Center
        required: true
        type: string
      publisher:
        description: Package/Identity/Publisher copied from Partner Center (CN=...)
        required: true
        type: string
      publisher_display_name:
        description: Package/Properties/PublisherDisplayName copied from Partner Center
        required: true
        default: Rafal Brzoska
        type: string

permissions:
  contents: read

concurrency:
  group: microsoft-store-msix-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  build-store-msix:
    name: Unsigned Store MSIX (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install and validate release source
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm verify:microsoft-store
          pnpm test:tools
      - name: Build Tauri executable without an MSI installer
        shell: pwsh
        run: pnpm tauri build --target x86_64-pc-windows-msvc --no-bundle
      - name: Package Store MSIX
        id: package
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ inputs.identity_name }}
          STORE_PUBLISHER: ${{ inputs.publisher }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
        run: |
          $version = node -p "require('./package.json').version"
          $assetName = "Skibidibi.Git_${version}_x64_store.msix"
          $assetPath = Join-Path $env:RUNNER_TEMP $assetName
          & ./tools/build-microsoft-store-msix.ps1 `
            -IdentityName $env:STORE_IDENTITY_NAME `
            -Publisher $env:STORE_PUBLISHER `
            -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME `
            -OutputPath $assetPath
          if ($LASTEXITCODE -ne 0) { throw "MSIX packaging failed." }
          "asset_name=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset_path=$assetPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Inspect package contents
        shell: pwsh
        run: |
          $unpackPath = Join-Path $env:RUNNER_TEMP "msix-inspection"
          $makeAppx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter makeappx.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\makeappx\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          & $makeAppx.FullName unpack /o /v /p '${{ steps.package.outputs.asset_path }}' /d $unpackPath
          if ($LASTEXITCODE -ne 0) { throw "The generated MSIX could not be unpacked." }
          $required = @("AppxManifest.xml", "SkibidibiGit.exe", "Assets\StoreLogo.png")
          foreach ($path in $required) {
            if (-not (Test-Path (Join-Path $unpackPath $path))) {
              throw "Generated MSIX is missing $path."
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-msix-${{ github.run_id }}
          path: ${{ steps.package.outputs.asset_path }}
          if-no-files-found: error
          retention-days: 14
