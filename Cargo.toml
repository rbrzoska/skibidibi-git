[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/app-domain",
    "crates/app-store",
    "crates/git-core",
    "crates/github-client",
    "crates/repo-runtime",
    "crates/secret-store",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/rbrzoska/skibidibi-git"

[workspace.dependencies]
app-domain = { path = "crates/app-domain" }
app-store = { path = "crates/app-store" }
git-core = { path = "crates/git-core" }
github-client = { path = "crates/github-client" }
repo-runtime = { path = "crates/repo-runtime" }
secret-store = { path = "crates/secret-store" }
rusqlite = { version = "0.40.1", features = ["bundled"] }
same-file = "1.0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1.23.5", features = ["v4"] }
url = "2"
zeroize = { version = "1", features = ["derive"] }
